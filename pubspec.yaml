name: delivery_partner_app
description: Qikzoo Delivery Partner — frontend
publish_to: 'none'
version: 0.4.5+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  get: ^4.6.6
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  pin_code_fields: ^8.0.1
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  equatable: ^2.0.5
  flutter_animate: ^4.5.0
  dio: ^5.7.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  image: ^4.8.0
  camera: ^0.11.2+1
  file_picker: ^8.1.2
  sms_autofill: ^2.5.0
  url_launcher: ^6.3.1
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  flutter_foreground_task: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/new_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/new_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/earnings/
    - assets/images/orders/
    - assets/images/profile/
    - assets/images/onboarding/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
